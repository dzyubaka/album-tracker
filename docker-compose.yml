services:
  app:
    image: album-tracker
    container_name: app
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: jdbc:postgresql://db/album_tracker

  db:
    image: postgres
    container_name: db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: album_tracker
      POSTGRES_PASSWORD: postgres

volumes:
  postgres_data:
